<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f7f7f7;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 3rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  background: white;
  border-radius: 12px;
}

img {
  width: 100%;
  border-radius: 12px;
}

.price {
  font-size: 1.5rem;
  font-weight: 600;
  margin: 1rem 0;
}

button {
  padding: 0.8rem 2rem;
  border: none;
  background: black;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.3s;
}

button:hover {
  background: #333;
}

/* Checkout Modal Styles */
.checkout-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.checkout-content {
  background: white;
  padding: 2rem;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
}

.checkout-content h2 {
  margin-top: 0;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 0.8rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: 'Poppins', sans-serif;
}

.form-group textarea {
  height: 100px;
  resize: vertical;
}

.modal-buttons {
  display: flex;
  gap: 1rem;
  margin-top: 1.5rem;
}

.cancel-btn {
  background: #666;
}

.success-message {
  display: none;
  background: #4CAF50;
  color: white;
  padding: 1rem;
  border-radius: 8px;
  margin-top: 1rem;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">
  <div>
    <img id="image">
  </div>

  <div>
    <h1 id="name"></h1>
    <p class="price" id="price"></p>
    <p id="description"></p>

    <br>
    <button id="orderBtn">Order Now</button>
  </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="checkout-modal">
  <div class="checkout-content">
    <h2>Checkout</h2>
    <form id="checkoutForm">
      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      
      <div class="form-group">
        <label for="address">Delivery Address *</label>
        <textarea id="address" name="address" required></textarea>
      </div>
      
      <div class="form-group">
        <label for="notes">Order Notes (Optional)</label>
        <textarea id="notes" name="notes" placeholder="Any special instructions..."></textarea>
      </div>
      
      <div class="modal-buttons">
        <button type="submit" style="flex: 1;">Place Order</button>
        <button type="button" id="cancelBtn" class="cancel-btn" style="flex: 1;">Cancel</button>
      </div>
    </form>
    
    <div id="successMessage" class="success-message">
      Order placed successfully! We'll contact you shortly.
    </div>
  </div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");
let productData = null;


const orderBtn = document.getElementById('orderBtn') || document.querySelector('button[onclick="orderNow()"]');
const checkoutModal = document.getElementById('checkoutModal');
const cancelBtn = document.getElementById('cancelBtn');
const checkoutForm = document.getElementById('checkoutForm');
const successMessage = document.getElementById('successMessage');


fetch(`api/products/single.php?id=${productId}`)
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP error! Status: ${res.status}`);
    }
    return res.json();
  })
  .then(product => {
    productData = product;
    console.log('Product data loaded:', productData);
    
    
    if (!productData.id) {
      console.error('Product data missing id:', productData);
    
      productData.id = productId;
    }
    
    document.getElementById("image").src = "Admin/" + product.image;
    document.getElementById("name").innerText = product.name;
    document.getElementById("price").innerText = "ZMW " + product.price;
    document.getElementById("description").innerText = product.description;
  })
  .catch(error => {
    console.error('Error fetching product:', error);
    alert('Error loading product details. Please try again.');
  });


function orderNow() {
  console.log('Order button clicked');
  
  if (!productData) {
    alert('Product data not loaded yet. Please wait.');
    return;
  }
  
  console.log('Product data for order:', productData); 
  
  
  if (checkoutModal) {
    checkoutModal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  } else {
  
    const customerName = prompt("Enter your name:");
    if (!customerName) return;
    
    const customerEmail = prompt("Enter your email:");
    if (!customerEmail) return;
    
    const customerPhone = prompt("Enter your phone number:");
    if (!customerPhone) return;
    
    const customerAddress = prompt("Enter your delivery address:");
    if (!customerAddress) return;
    
    placeOrder({
      customer: {
        fullName: customerName,
        email: customerEmail,
        phone: customerPhone,
        address: customerAddress,
        notes: ''
      },
      product: {
        id: productData.id || productId,
        name: productData.name,
        price: productData.price,
        quantity: 1
      }
    });
  }
}


if (checkoutForm) {
  checkoutForm.addEventListener('submit', function(e) {
    e.preventDefault();
    

    const formData = {
      customer: {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        notes: document.getElementById('notes').value
      },
      product: {
        id: productData.id || productId,
        name: productData.name,
        price: parseFloat(productData.price),
        quantity: 1
      }
    };
    
    console.log('Form data to send:', formData); 
    
    placeOrder(formData);
  });
}


function placeOrder(orderData) {
  console.log('Placing order with data:', orderData); 
  
  
  const submitBtn = document.querySelector('#checkoutForm button[type="submit"]') || orderBtn;
  const originalText = submitBtn.textContent;
  submitBtn.textContent = 'Processing...';
  submitBtn.disabled = true;
  
  
  fetch('api/orders/create.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(orderData)
  })
  .then(response => {
    console.log('Response status:', response.status);
    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    console.log('Order response:', data); 
    
    if (data.success) {
      
      if (successMessage) {
        successMessage.style.display = 'block';
        successMessage.innerHTML = `
          <h3>✓ Order Successful!</h3>
          <p>Order ID: ${data.order_id}</p>
          <p>Thank you for your order. We'll contact you shortly.</p>
        `;
        if (checkoutForm) checkoutForm.style.display = 'none';
      } else {
        alert(`Order placed successfully!\nOrder ID: ${data.order_id}\nWe'll contact you shortly.`);
      }
      
      
      setTimeout(() => {
        if (checkoutModal) {
          checkoutModal.style.display = 'none';
          document.body.style.overflow = 'auto';
        }
        if (successMessage) successMessage.style.display = 'none';
        if (checkoutForm) {
          checkoutForm.style.display = 'block';
          checkoutForm.reset();
        }
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }, 5000);
      
    } else {
      throw new Error(data.message || data.error || 'Failed to place order');
    }
  })
  .catch(error => {
    console.error('Error placing order:', error);
    alert('Error placing order: ' + error.message);
    submitBtn.textContent = originalText;
    submitBtn.disabled = false;
  });
}


if (cancelBtn) {
  cancelBtn.addEventListener('click', function() {
    if (checkoutModal) {
      checkoutModal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  });
}


if (checkoutModal) {
  checkoutModal.addEventListener('click', function(e) {
    if (e.target === checkoutModal) {
      checkoutModal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  });
}
</script>
</body>
</html>
